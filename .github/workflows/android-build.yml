name: KAR7 PRO Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          problem-matcher: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-36.1 platforms;android-36 build-tools;36.0.0"

      - name: Verify Android SDK installation
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls -la "${ANDROID_HOME}/platforms" "${ANDROID_HOME}/build-tools"

      - name: Setup Gradle & cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Make gradlew executable and check Gradle Wrapper version
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            echo "Gradle wrapper artifact missing in checkout; generating Gradle 9.3.1 wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Ensure CI debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests and build Debug APK
        run: ./gradlew clean testDebugUnitTest assembleDebug

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: KAR7-PRO-UNIT-TEST-REPORT
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore

      - name: Verify Debug APK output
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: KAR7-PRO-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Check optional release signing secrets
        id: check_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets unavailable. The Release APK has not been signed; Debug APK build completed."
            {
              echo "### Release Signing Status"
              echo "The Release APK has **not** been signed because one or more GitHub Secrets (\`KEYSTORE_BASE64\`, \`KEYSTORE_PASSWORD\`, \`KEY_ALIAS\`, \`KEY_PASSWORD\`) are unavailable. \`KAR7-PRO-DEBUG-APK\` was built and uploaded."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build signed Release APK (when secrets are configured)
        if: steps.check_signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 --decode > "${{ runner.temp }}/release-keystore.jks"
          export KEYSTORE_PATH="${{ runner.temp }}/release-keystore.jks"
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="${{ runner.temp }}/release-keystore.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Clean up decoded release keystore
        if: always() && steps.check_signing.outputs.available == 'true'
        run: rm -f "${{ runner.temp }}/release-keystore.jks"

      - name: Upload signed Release APK artifact
        if: steps.check_signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: KAR7-PRO-RELEASE-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error
